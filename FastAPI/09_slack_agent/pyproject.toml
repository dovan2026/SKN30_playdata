[project]
name = "slack-botto-agent"
version = "0.1.0"
description = "Slack economic-news chatbot powered by FastAPI, LangGraph, Tavily, and OpenAI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.11,<4",
    "aiosqlite>=0.21,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "slack-bolt>=1.23,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tavily-python>=0.7,<1",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["app"]
