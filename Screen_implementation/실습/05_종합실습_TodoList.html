<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>05. 종합실습 - 투두리스트 (시작 파일)</title>
<style>
  body {
    font-family: "Malgun Gothic", sans-serif;
    background: #f1f5f9;
    display: flex;
    justify-content: center;
    padding-top: 60px;
    margin: 0;
  }
  .todo-app {
    background: white;
    width: 380px;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
  }
  .todo-app h1 {
    font-size: 20px;
    margin-top: 0;
    color: #0f172a;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-row input {
    flex: 1;
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
  }
  .input-row button {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
  }
  .input-row button:hover { background: #1e40af; }

  #todoList {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  #todoList li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid #e2e8f0;
    font-size: 14px;
  }
  #todoList li span.todo-text {
    cursor: pointer;
    flex: 1;
  }
  /* TODO 3: 완료된 항목에 취소선을 표시할 클래스를 만드세요 (예: .completed) */
  /*
  .completed {
    text-decoration: line-through;
    color: #94a3b8;
  }
  */
  #todoList li button.delete-btn {
    background: #fee2e2;
    color: #b91c1c;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="todo-app">
  <h1>오늘의 할 일</h1>
  <div class="input-row">
    <input type="text" id="todoInput" placeholder="할 일을 입력하세요">
    <button onclick="addTodo()">추가</button>
  </div>
  <ul id="todoList">
    <!-- JavaScript로 <li> 항목이 여기에 추가됩니다 -->
  </ul>
</div>

      return;

    // deleteBtn.className = "delete-btn";
    // deleteBtn.textContent = "삭제";

</body>
</html>
