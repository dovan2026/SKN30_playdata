<h1>게시글 목록</h1>
<p><a href="{% url 'post_create' %}">글쓰기</a></p>

{% if user.is_authenticated %}
    <p><a href='{% url 'post_create' %}'>글쓰기</a></p>
{% else %}
    <p>글을 쓰려면 관리자 로그인이 필요합니다.</p>
{% endif %}

{% for post in posts %}
    <article>
        <h2><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h2>
        <p>{{ post.content|truncatewords:20 }}</p>
    </article>
{% empty %}
    <p>게시글이 없습니다.</p>
{% endfor %}
