[project]
name = "llm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "apyori>=1.1.2",
    "chronos>=0.3",
    "gensim>=4.4.0",
    "langchain>=1.3.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.6",
    "langchain-openai>=1.3.0",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "openai>=2.41.0",
    "pd>=0.0.4",
    "pip>=26.1.2",
    "plotly>=6.7.0",
    "prophet>=1.3.0",
    "px>=0.2.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pyldavis>=3.4.1",
    "pypdf>=6.13.2",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "selenium>=4.44.0",
    "streamlit>=1.58.0",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
    "webdriver-manager>=4.1.1",
    "wordcloud>=1.9.6",
    "yfinance>=1.4.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jpype1>=1.7.1",
    "konlpy>=0.6.0",
    "nbformat>=5.10.4",
    "pandas>=3.0.3",
]
